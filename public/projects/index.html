<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fahreza Sugiono</title>
  <meta name="description" content="Client work built from scratch, turning complex ideas into live products." />
  <link rel="preload" href="/fonts/GoogleSans-Regular.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>
    // Language chosen in this browser session (English is the default on every new visit):
    // keep translatable text hidden until i18n.js has applied it (no flash of English).
    try {
      if (sessionStorage.getItem("lang") === "ja") {
        document.documentElement.lang = "ja";
        document.documentElement.classList.add("lang-pending");
      }
    } catch (e) {}
    // Intro plays on the first visit and on every refresh; a refresh always lands on Index.
    try {
      var nav = performance.getEntriesByType("navigation")[0];
      var isReload = !!nav && nav.type === "reload";
      var forced = sessionStorage.getItem("intro-force") === "1";
      sessionStorage.removeItem("intro-force");
      if (isReload && location.pathname !== "/") {
        sessionStorage.setItem("intro-force", "1");
        window.__introRedirect = true;
        document.documentElement.classList.add("is-intro");
        location.replace("/");
      } else if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        if (isReload || forced || !sessionStorage.getItem("intro-seen")) {
          document.documentElement.classList.add("is-intro");
          setTimeout(function () { document.documentElement.classList.remove("is-intro", "is-intro-ready"); }, 6000);
        } else {
          // Navigating between pages: main blocks rise + fade in one by one.
          document.documentElement.classList.add("is-enter");
          setTimeout(function () { document.documentElement.classList.remove("is-enter", "is-enter-ready"); }, 3000);
        }
      }
    } catch (e) {}
  </script>
  <link rel="preload" href="/assets/logo.png" as="image" />
</head>
<body>
  <div class="page">
    <aside class="left">
      <div class="left__content">
        <a href="/" class="logo" aria-label="MDSVMR home">
          <img src="/assets/logo.png" alt="MDSVMR" />
        </a>
        <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
          <span class="menu-toggle__line"></span>
          <span class="menu-toggle__line"></span>
        </button>
        <div class="menu-panel">
          <nav class="menu" id="site-menu" aria-label="Main">
            <a href="/" class="link" data-i18n="nav.index">Index</a>
            <a href="/projects/" class="link is-active" aria-current="page" data-i18n="nav.projects">Projects</a>
            <a href="/works/" class="link" data-i18n="nav.works">Works</a>
            <a href="/frames/" class="link" data-i18n="nav.frames">Frames</a>
            <a href="/about/" class="link" data-i18n="nav.about">About</a>
            <div class="lang-switch lang-switch--menu" role="group" aria-label="Language">
              <button type="button" class="link lang-switch__option" data-lang="en" lang="en">EN</button>
              <button type="button" class="link lang-switch__option" data-lang="ja" lang="ja">日</button>
            </div>
          </nav>
        </div>
        <div class="left__divider" aria-hidden="true"></div>
      </div>
    </aside>

    <main class="main main--projects">
      <section class="group">
        <h1 class="strong page-title" data-i18n="projects.title">Projects</h1>
        <p data-i18n="projects.desc">Client work built from scratch, turning complex ideas into live products.</p>
      </section>

      <article class="project">
        <div class="group">
          <a href="https://www.ezpairs.xyz/" class="link strong project__title" target="_blank" rel="noopener">Ezpairs.xyz</a>
          <p data-i18n="projects.ezpairs">Decentralized cryptocurrency pair trading platform.</p>
        </div>
        <video class="project__image project__video" data-src="/media/ezpairs-project.mp4" width="1920" height="1440" muted loop playsinline preload="none" aria-label="Ezpairs pair trading website shown on a desktop monitor"></video>
        <a href="https://www.behance.net/gallery/244079331/Ezpairs-Crypto-Exchange-Website-Branding-UIUX" class="link project__case" target="_blank" rel="noopener" data-i18n="projects.caseStudy">View Case Studies</a>
      </article>

      <article class="project">
        <div class="group">
          <a href="https://www.shopra.ai/" class="link strong project__title" target="_blank" rel="noopener">Shopra.ai</a>
          <p data-i18n="projects.shopra">AI-powered data intelligence platform for beverage brands.</p>
        </div>
        <video class="project__image project__video" data-src="/media/shopra-project.mp4" width="1920" height="1440" muted loop playsinline preload="none" aria-label="Shopra product preview"></video>
      </article>
    </main>

    <div class="right">
      <div class="lang-switch lang-switch--desktop" role="group" aria-label="Language">
        <button type="button" class="link lang-switch__option" data-lang="en" lang="en">EN</button>
        <button type="button" class="link lang-switch__option" data-lang="ja" lang="ja">日</button>
      </div>
    </div>
  </div>
  <script src="/i18n.js"></script>
  <script src="/intro.js" defer></script>
  <script src="/media.js" defer></script>
  <script src="/nav.js" defer></script>
</body>
</html>
